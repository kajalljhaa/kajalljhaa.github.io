<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found | Alex Morgan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body{display:flex;min-height:100svh;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.err-num{font-family:'Manrope',sans-serif;font-size:clamp(6rem,18vw,12rem);font-weight:900;line-height:1;letter-spacing:-.06em;background:linear-gradient(135deg,#6366F1,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.err-title{font-family:'Manrope',sans-serif;font-size:1.5rem;font-weight:800;color:var(--text);margin-bottom:12px}
.err-desc{color:var(--text-2);margin-bottom:32px;max-width:380px;line-height:1.7}
.err-link{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:12px;background:#6366F1;color:#fff;font-weight:700;transition:transform .2s,box-shadow .2s}
.err-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.4)}
</style>
</head>
<body>
<div>
  <div class="err-num">404</div>
  <h1 class="err-title">Page Not Found</h1>
  <p class="err-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
  <a href="/" class="err-link">← Back to Portfolio</a>
</div>
</body>
</html>
